name: "Build"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Publish code coverage
        if: matrix.node-version == '22.x' && endsWith(github.ref, '/main') && github.event_name == 'push'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info
          format: lcov

  ci:
    name: CI
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Require successful builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success

  package:
    name: Package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create package
        run: |
          mkdir package
          pnpm pack --pack-destination package

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: npm-package
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: npm-publish
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: npm-package
          path: package

      - name: Check current main commit
        id: current_commit
        run: |
          CURRENT_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$CURRENT_SHA" == "$GITHUB_SHA" ]]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale commit $GITHUB_SHA; main is now $CURRENT_SHA"
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.current_commit.outputs.should-publish == 'true'
        run: ./publish.sh package/*.tgz
